services:
  api:
    build:
      context: ../..
      dockerfile: deploy/e2e-container/Dockerfile
    image: symphony-tracker:local
    container_name: symphony-e2e-api
    restart: unless-stopped
    working_dir: /app/python
    environment:
      HOME: /root
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      SYMPHONY_API_TOKEN: ${SYMPHONY_API_TOKEN}
      PI_CODING_AGENT_DIR: /pi-agent
    volumes:
      - ./WORKFLOW.md:/app/WORKFLOW.md:ro
      - ./land:/app/skills/land:ro
      - ./data:/data
      # 必须是可写副本：pi 会在配置目录写 auth.json.lock
      - ./pi-agent:/pi-agent
    ports:
      - "18330:18330"
    command: ["python3", "-m", "symphony", "--workflow", "/app/WORKFLOW.md"]

  board:
    image: symphony-tracker:local
    container_name: symphony-e2e-board
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - api
    environment:
      HOME: /root
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      SYMPHONY_WORKFLOW: /app/WORKFLOW.md
      SYMPHONY_STATE_URL: http://api:18330/api/v1/state
      SYMPHONY_API_TOKEN: ${SYMPHONY_API_TOKEN}
      SYMPHONY_SESSIONS: /data/sessions
      SYMPHONY_SESSIONS_LIVE: /data/sessions-live
      SYMPHONY_GITHUB_POLL_S: "3"
    volumes:
      - ./WORKFLOW.md:/app/WORKFLOW.md:ro
      - ./data:/data
    ports:
      - "18332:18332"
    command: ["python3", "/app/board/server.py", "--bind", "0.0.0.0", "--port", "18332"]
